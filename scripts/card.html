<!-- The share card of one app, filled in and screenshotted at 1200x630 by scripts/cards.py.
     {{...}} are filled in there, already escaped. Class names start with oc__ so they never meet the site's. -->
<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="/style.css">
<style>
html,body{width:1200px;height:630px;margin:0;overflow:hidden;background:var(--paper)}
.oc{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:52px 64px 48px;display:flex;flex-direction:column;
  background-image:radial-gradient(var(--ink) 1.2px,transparent 1.3px);background-size:22px 22px}
.oc__top{display:flex;justify-content:space-between;align-items:flex-start}
.oc .logo__stack{font-size:34px}.oc .logo em{font-size:22px;padding:6px 10px}
.oc .kills{font-size:18px;padding:12px 18px;border-width:4px;box-shadow:8px 8px 0 var(--ink);transform:rotate(3deg);background:#fff;max-width:640px;text-align:right}
.oc .kills s{font-size:{{vsize}}px;text-decoration-thickness:4px;line-height:1.15;display:block;text-wrap:balance}
.oc__app{display:flex;align-items:center;gap:30px;margin:34px 0 0}
.oc__icon{width:112px;height:112px;flex:none;border:5px solid var(--ink);background:#fff;box-shadow:8px 8px 0 var(--pink);display:grid;place-items:center;font-size:62px}
.oc h1{font-size:{{size}}px;line-height:.98;padding-bottom:.06em;letter-spacing:-.04em;margin:0;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc__tag{font-size:27px;line-height:1.3;margin:22px 0 0;max-width:1060px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;background:var(--paper);padding:2px 0}
.oc__foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.oc__who{display:flex;align-items:center;gap:18px;font-family:var(--mono);font-size:21px;text-transform:uppercase;letter-spacing:.06em;background:var(--paper);padding-right:10px}
.oc__who b{font-family:var(--display);font-size:30px;letter-spacing:-.02em;text-transform:none;display:block}
.oc__av{width:92px;height:92px;border-radius:50%;border:5px solid var(--ink);box-shadow:6px 6px 0 var(--pink);object-fit:cover;flex:none;background:#fff}
.oc__fb{display:grid;place-items:center;font-family:var(--display);font-size:42px}
.oc__right{display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:22px;text-transform:uppercase}
.oc__score{background:#fff;border:4px solid var(--ink);padding:8px 14px;box-shadow:5px 5px 0 var(--ink)}
.oc__free{font-family:var(--display);font-size:44px;background:var(--pink);color:#fff;border:5px solid var(--ink);padding:4px 18px;transform:rotate(-4deg);box-shadow:6px 6px 0 var(--ink)}
</style>
<div class="oc">
  <div class="oc__top">
    <div class="logo"><span class="logo__stack"><span>SPITE</span><span>WARE</span></span><em>.ai</em></div>
    <div class="kills">replaces<s>{{victim}}</s></div>
  </div>
  <div class="oc__app"><div class="oc__icon">{{icon}}</div><h1>{{name}}</h1></div>
  <p class="oc__tag">{{tagline}}</p>
  <div class="oc__foot">
    <div class="oc__who">{{face}}<span>built by<b>{{builder}}</b></span></div>
    <div class="oc__right"><span class="oc__score">🔥 {{score}}/10 spite</span><span class="oc__free">$0</span></div>
  </div>
</div>
