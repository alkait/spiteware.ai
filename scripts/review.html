<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>spiteware review desk</title>
<style>
:root{--paper:#FFF8E7;--ink:#111;--pink:#FF3E9A;--yellow:#FFE600;--blue:#2D5BFF;--green:#00D084;--red:#E5322D;--bw:3px;--shadow:6px 6px 0 var(--ink);
--display:"Arial Black","Helvetica Neue",Impact,system-ui,sans-serif;--body:system-ui,sans-serif;--mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);background-image:radial-gradient(var(--ink) .8px,transparent .8px);background-size:22px 22px}
a{color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper);border-bottom:var(--bw) solid var(--ink);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:-.02em}header h1 span{color:var(--yellow)}
.pill{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;background:var(--yellow);color:var(--ink);padding:5px 10px;border:2px solid var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
.run{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:26px 0 14px;padding:8px 12px;background:#fff;border:2px dashed var(--ink)}
.row{display:grid;grid-template-columns:340px 1fr;gap:22px;margin-bottom:26px;align-items:start}
@media (max-width:820px){.row{grid-template-columns:1fr}}
.card{background:#fff;border:var(--bw) solid var(--ink);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px;position:relative}
.card__top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card__icon{width:48px;height:48px;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:24px;flex:none;background:var(--yellow)}
.kills{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;border:2px solid var(--ink);padding:4px 8px;background:var(--paper);text-align:right;line-height:1.3}
.kills s{color:#b00;font-weight:700;display:block;font-size:13px;text-decoration:line-through;text-decoration-color:var(--pink);text-decoration-thickness:2px}
.card h3{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.02em;margin:0;line-height:1.05}
.card p{margin:0;font-size:15px;color:#333}
.card__grudge{margin:0;font-family:Georgia,serif;font-style:italic;font-size:14px;color:#555;border-left:3px solid var(--pink);padding-left:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-family:var(--mono);font-size:11px;text-transform:uppercase;background:var(--yellow);border:2px solid var(--ink);padding:2px 7px}.chip--vibe{background:var(--pink);color:#fff}
.card__meta{display:flex;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:2px dashed #ccc;font-family:var(--mono);font-size:12px}
[contenteditable]{outline:none;border-bottom:2px dotted transparent}[contenteditable]:hover{border-bottom-color:var(--blue);background:#f4f7ff}[contenteditable]:focus{border-bottom-color:var(--pink);background:#fff6fb}
.state{position:absolute;top:-14px;right:-10px;font-family:var(--display);font-size:12px;text-transform:uppercase;padding:6px 10px;border:var(--bw) solid var(--ink);transform:rotate(6deg);background:#fff}
.state--approve{background:var(--green)}.state--reject{background:var(--red);color:#fff}.state--pending{background:var(--yellow)}
.panel{background:var(--paper);border:var(--bw) solid var(--ink);padding:18px 20px;display:grid;gap:12px}
.panel dl{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;margin:0;font-size:14px}
.panel dt{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#555;padding-top:2px}.panel dd{margin:0}
.panel dd a{word-break:break-all;text-decoration:none;border-bottom:2px solid var(--pink)}
.score{font-family:var(--display);font-size:32px;line-height:1}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{font-family:var(--display);font-size:14px;text-transform:uppercase;padding:12px 18px;border:var(--bw) solid var(--ink);background:var(--paper);box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn--ok{background:var(--green)}.btn--no{background:var(--red);color:#fff}.btn--merge{background:var(--pink);color:#fff}.btn--ink{background:var(--ink);color:var(--yellow)}
.why{font-family:var(--mono);font-size:12px;color:#444;background:#fff;border:2px solid var(--ink);padding:8px 10px}
.dropped{font-family:var(--mono);font-size:12px;color:#444;background:#fff;border:2px solid var(--ink);padding:12px 16px;margin-top:8px}.dropped li{margin:4px 0}
.empty{font-family:var(--display);font-size:26px;text-align:center;padding:60px 20px;background:#fff;border:var(--bw) solid var(--ink);box-shadow:var(--shadow)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--yellow);font-family:var(--mono);font-size:13px;padding:10px 16px;border:2px solid var(--yellow);display:none}
</style></head><body>
<header><h1>spiteware <span>review desk</span></h1><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill" id="count">loading</span><button class="btn btn--merge" id="merge">Merge approved → apps.json</button></div></header>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
let data;
async function load(){ data=await (await fetch('/api/queue')).json(); render(); }
function render(){
  const app=$('#app'); app.innerHTML='';
  let pending=0, total=0;
  for(const run of data.runs){
    const sec=document.createElement('section');
    sec.innerHTML=`<div class="run">run ${esc(run.run)} · ${esc(run.swept)} · raw ${run.raw_hits} · triaged ${run.triaged} · candidates ${run.candidates.length}</div>`;
    for(const c of run.candidates){ total++; if(c.status==='pending') pending++; sec.appendChild(row(run,c)); }
    if(run.dropped?.length) sec.insertAdjacentHTML('beforeend',`<details class="dropped"><summary>${run.dropped.length} dropped after verification</summary><ul>${run.dropped.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></details>`);
    app.appendChild(sec);
  }
  if(!total) app.innerHTML='<div class="empty">Queue empty. Nobody got mad today. 🧘</div>';
  $('#count').textContent=`${pending} pending · ${total} in queue · ${data.apps.length} live`;
}
function row(run,c){
  const el=document.createElement('div'); el.className='row';
  el.innerHTML=`
  <a class="card" href="${esc(c.url)}" target="_blank" rel="noopener" onclick="if(event.target.isContentEditable)event.preventDefault()">
    <span class="state state--${esc(c.status)}">${esc(c.status)}</span>
    <div class="card__top"><div class="card__icon" contenteditable data-k="icon">${esc(c.icon)}</div>
      <div class="kills">replaces<s><span contenteditable data-k="replaces.name">${esc(c.replaces.name||'')||'(victim?)'}</span> · <span contenteditable data-k="replaces.price">${esc(c.replaces.price||'')||'(price?)'}</span></s></div></div>
    <h3 contenteditable data-k="name">${esc(c.name)}</h3><p contenteditable data-k="tagline">${esc(c.tagline)}</p>
    <blockquote class="card__grudge">“<span contenteditable data-k="grudge.quote">${esc(c.grudge.quote)}</span>”</blockquote>
    <div class="chips"><span class="chip" contenteditable data-k="tags">${esc(c.tags.join(', '))}</span>${c.vibe_coded?'<span class="chip chip--vibe">vibe coded</span>':''}</div>
    <div class="card__meta"><span>by ${esc(c.builder.name)}</span><span>🔥 <span contenteditable data-k="spite_score">${esc(c.spite_score)}</span>/10</span></div>
  </a>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center"><div class="score">${esc(c.spite_score)}<small style="font-size:14px">/10</small></div><label class="pill" style="cursor:pointer"><input type="checkbox" data-k="vibe_coded" ${c.vibe_coded?'checked':''}> vibe coded</label></div>
    <dl>
      <dt>app</dt><dd><a href="${esc(c.url)}" target="_blank">${esc(c.url)}</a></dd>
      <dt>grudge source</dt><dd><a href="${esc(c.grudge.source)}" target="_blank">${esc(c.grudge.source)}</a></dd>
      <dt>price source</dt><dd><a href="${esc(c.replaces.source)}" target="_blank">${esc(c.replaces.source)}</a> ${c.replaces.note?`<em>(${esc(c.replaces.note)})</em>`:''}</dd>
      <dt>builder</dt><dd>${esc(c.builder.name)} ${c.builder.handle?`· @${esc(c.builder.handle)}`:''}</dd>
    </dl>
    <div class="why">${esc(c.why)}</div>
    <div class="actions">
      <button class="btn btn--ok" data-s="approve">✓ Approve</button>
      <button class="btn btn--no" data-s="reject">✕ Reject</button>
      <button class="btn" data-s="pending">↺ Undo</button>
      <button class="btn btn--ink" data-save>Save edits</button>
    </div>
    <div style="font-family:var(--mono);font-size:11px;color:#666">click any text on the card to edit it, then Save edits</div>
  </div>`;
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>decide(run,c,{status:b.dataset.s}));
  $('[data-save]',el).onclick=()=>decide(run,c,collect(el));
  return el;
}
function collect(el){
  const o={replaces:{},grudge:{}};
  el.querySelectorAll('[contenteditable][data-k]').forEach(n=>{
    const v=n.textContent.trim(), k=n.dataset.k;
    if(k==='tags') o.tags=v.split(',').map(s=>s.trim()).filter(Boolean);
    else if(k==='spite_score') o.spite_score=parseInt(v)||0;
    else if(k.includes('.')){const [a,b]=k.split('.'); o[a][b]=v;} else o[k]=v;
  });
  o.vibe_coded=$('[data-k="vibe_coded"]',el).checked; return o;
}
async function decide(run,c,patch){
  await fetch('/api/decide',{method:'POST',body:JSON.stringify({file:run.file,slug:c.slug,...patch})});
  toast(patch.status?`${c.name}: ${patch.status}`:`${c.name}: saved`); await load();
}
$('#merge').onclick=async()=>{ const r=await (await fetch('/api/merge',{method:'POST',body:'{}'})).json();
  const a=r.results.flatMap(x=>x.approved), j=r.results.flatMap(x=>x.rejected);
  toast(`merged · approved ${a.length?a.join(', '):'none'} · rejected ${j.length?j.join(', '):'none'} · now push to publish`); await load(); };
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3500);}
load();
</script></body></html>
